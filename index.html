        <style>
            :root {
                --bg-color: #ffffff;
                --text-color: rgba(0, 0, 0, 0.78);
                --muted-color: rgba(0, 0, 0, 0.5);
                --hover-bg: rgba(0, 0, 0, 0.78);
                --hover-text: #ffffff;
                --selection-bg: #ffffff;
                --selection-color: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-color: #0e1117;
                    --text-color: rgba(255, 255, 255, 0.85);
                    --muted-color: rgba(255, 255, 255, 0.45);
                    --hover-bg: rgba(255, 255, 255, 0.85);
                    --hover-text: #0e1117;
                    --selection-bg: #ffffff;
                    --selection-color: #ffffff;
                }
            }

            @keyframes slideDown {
                0% {
                    transform: translateY(-20px);
                    opacity: 0;
                }
                100% {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* Bloqueo total de selección de texto */
            html, body {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            ::selection {
                background: var(--selection-bg);
                color: var(--selection-color);
            }

            ::-moz-selection {
                background: var(--selection-bg);
                color: var(--selection-color);
            }

            body {
                font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
                line-height: 1.4;
                background-color: var(--bg-color);
                color: var(--text-color);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 24px;
            }

            main {
                max-width: 650px;
                width: 100%;
            }

            h1 {
                font-size: 1.75rem;
                font-weight: 700;
                letter-spacing: -0.5px;
                animation: 1.2s ease-out 0s 1 slideDown;
            }

            .job {
                font-size: 1.05rem;
                margin-top: 15px;
                font-weight: 400;
                animation: 1s ease-out 0s 1 slideDown;
            }

            .job .corporation {

            }

            .nav-section {
                margin-top: 14px;
                font-size: 0.875rem;
                font-weight: 300;
                animation: 1.5s ease-out 0s 1 slideDown;
            }

            .nav-section:first-of-type {
                margin-top: 35px;
            }

            .label {
                color: var(--muted-color);
                margin-bottom: 6px;
            }

            .links {
                display: inline-block;
            }

            a {
                text-decoration: none;
                color: var(--text-color);
                padding: 1px 3px;
                border-radius: 2px;
                transition: color 0.15s ease, background-color 0.15s ease;
            }

            a:hover, a:focus-visible {
                color: var(--hover-text);
                background-color: var(--hover-bg);
                outline: none;
            }

            .separator {
                color: var(--muted-color);
                padding: 0 3px;
            }

            @media (prefers-reduced-motion: reduce) {
                h1, .job, .nav-section {
                    animation: none;
                }
            }
        </style>
