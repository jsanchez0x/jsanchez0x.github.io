        <!-- Tipografía estilo hacker: JetBrains Mono (autoalojada) -->
        <style>
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: normal;
                font-weight: 300 700;
                font-display: swap;
                src: url('fonts/jetbrains-mono-latin.woff2') format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: normal;
                font-weight: 300 700;
                font-display: swap;
                src: url('fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
                unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: italic;
                font-weight: 400;
                font-display: swap;
                src: url('fonts/jetbrains-mono-italic-latin.woff2') format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: italic;
                font-weight: 400;
                font-display: swap;
                src: url('fonts/jetbrains-mono-italic-latin-ext.woff2') format('woff2');
                unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }

            :root {
                --bg-color: #ffffff;
                --text-color: rgba(0, 0, 0, 0.78);
                --muted-color: rgba(0, 0, 0, 0.5);
                --hover-bg: rgba(0, 0, 0, 0.78);
                --hover-text: #ffffff;
                --selection-bg: #ffffff;
                --selection-color: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-color: #0e1117;
                    --text-color: rgba(255, 255, 255, 0.85);
                    --muted-color: rgba(255, 255, 255, 0.45);
                    --hover-bg: rgba(255, 255, 255, 0.85);
                    --hover-text: #0e1117;
                    --selection-bg: #ffffff;
                    --selection-color: #ffffff;
                }
            }

            @keyframes slideDown {
                0% {
                    transform: translateY(-20px);
                    opacity: 0;
                }
                100% {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            @keyframes cursorBlink {
                0%, 100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0;
                }
            }

            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* Bloqueo total de selección de texto */
            html, body {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            ::selection {
                background: var(--selection-bg);
                color: var(--selection-color);
            }

            ::-moz-selection {
                background: var(--selection-bg);
                color: var(--selection-color);
            }

            body {
                font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
                line-height: 1.4;
                background-color: var(--bg-color);
                color: var(--text-color);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 24px;
            }

            main {
                max-width: 650px;
                width: 100%;
            }

            h1 {
                font-size: 1.75rem;
                font-weight: 700;
                letter-spacing: -0.5px;
                display: inline-block;
                animation: 1.2s ease-out 0s 1 slideDown;
            }

            /* Cursor parpadeante estilo terminal */
            h1::after {
                content: '_';
                display: inline-block;
                color: var(--text-color);
                margin-left: 2px;
                animation: cursorBlink 1s step-end infinite;
            }

            .job {
                font-size: 1.05rem;
                margin-top: 15px;
                font-weight: 400;
                animation: 1s ease-out 0s 1 slideDown;
            }

            .job .corporation {
                font-style: italic;
            }

            .nav-section {
                margin-top: 14px;
                font-size: 0.875rem;
                font-weight: 300;
                animation: 1.5s ease-out 0s 1 slideDown;
            }

            .nav-section:first-of-type {
                margin-top: 35px;
            }

            .label {
                color: var(--muted-color);
                margin-bottom: 6px;
            }

            .links {
                display: inline-block;
            }

            a {
                text-decoration: none;
                color: var(--text-color);
                padding: 1px 3px;
                border-radius: 2px;
                transition: color 0.15s ease, background-color 0.15s ease;
            }

            a:hover, a:focus-visible, a.active-shortcut {
                color: var(--hover-text);
                background-color: var(--hover-bg);
                outline: none;
            }

            .separator {
                color: var(--muted-color);
                padding: 0 3px;
            }

            /* Ventana flotante de ayuda (Terminal Modal) */
            .modal-backdrop {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }

            .modal-backdrop.is-open {
                display: flex;
            }

            .modal-box {
                background-color: var(--bg-color);
                color: var(--text-color);
                border: 1px solid var(--hover-bg);
                padding: 18px 22px;
                max-width: 340px;
                width: 90%;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
                border-radius: 4px;
                animation: 0.15s ease-out 0s 1 slideDown;
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 14px;
                font-size: 0.85rem;
                color: var(--muted-color);
                border-bottom: 1px dashed var(--muted-color);
                padding-bottom: 8px;
            }

            #close-modal {
                background: none;
                border: none;
                color: var(--muted-color);
                cursor: pointer;
                font-family: inherit;
                font-size: 0.8rem;
                padding: 2px 4px;
            }

            #close-modal:hover {
                color: var(--text-color);
            }

            .shortcut-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .shortcut-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 0.85rem;
            }

            .shortcut-row kbd {
                font-family: inherit;
                background-color: var(--hover-bg);
                color: var(--hover-text);
                padding: 1px 6px;
                border-radius: 2px;
                font-size: 0.8rem;
                font-weight: 700;
            }

            .shortcut-row span {
                color: var(--text-color);
            }

            @media (prefers-reduced-motion: reduce) {
                h1, .job, .nav-section, .modal-box {
                    animation: none;
                }
                h1::after {
                    animation: none;
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Jorge Sánchez López</h1>

        <!-- Ventana modal de ayuda de atajos -->
        <div id="help-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Atajos de teclado">
            <div class="modal-box">
                <div class="modal-header">
                    <span>// keyboard_shortcuts</span>
                    <button id="close-modal" aria-label="Cerrar ventana">[esc]</button>
                </div>
                <div class="shortcut-list">
                    <div class="shortcut-row"><kbd>m</kbd> <span>Mail</span></div>
                    <div class="shortcut-row"><kbd>l</kbd> <span>LinkedIn</span></div>
                    <div class="shortcut-row"><kbd>g</kbd> <span>GitHub</span></div>
                    <div class="shortcut-row"><kbd>b</kbd> <span>Blog (Ilogeek)</span></div>
                    <div class="shortcut-row"><kbd>t</kbd> <span>Mastodon</span></div>
                    <div class="shortcut-row"><kbd>x</kbd> <span>X</span></div>
                    <div class="shortcut-row"><kbd>i</kbd> <span>Instagram</span></div>
                    <div class="shortcut-row"><kbd>s</kbd> <span>Shutterstock</span></div>
                    <div class="shortcut-row"><kbd>?</kbd> <span>Cerrar / Toggle</span></div>
                </div>
            </div>
        </div>

        <script>
            (function() {
                const shortcuts = {
                    'm': 'mailto:hola@jsanchez.me',
                    'l': 'https://www.linkedin.com/in/jsanchez0x',
                    'g': 'https://github.com/jsanchez0x',
                    'b': 'https://ilogeek.es/',
                    't': 'https://mastodon.world/@jsanchez0x',
                    'x': 'https://x.com/jsanchez0x',
                    'i': 'https://www.instagram.com/jsanchez.raw',
                    's': 'https://www.shutterstock.com/es/g/JSanchez0x'
                };

                const modal = document.getElementById('help-modal');
                const closeBtn = document.getElementById('close-modal');

                function toggleModal() {
                    const isOpen = modal.classList.toggle('is-open');
                    modal.setAttribute('aria-hidden', !isOpen);
                }

                function closeModal() {
                    modal.classList.remove('is-open');
                    modal.setAttribute('aria-hidden', 'true');
                }

                closeBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModal();
                    }
                });

                function logShortcuts() {
                    console.log(
                        '%c[jsanchez.me]%c Terminal Shortcuts:\n' +
                        '  [m] Mail\n' +
                        '  [l] LinkedIn\n' +
                        '  [g] GitHub\n' +
                        '  [b] Blog (Ilogeek)\n' +
                        '  [t] Mastodon\n' +
                        '  [x] X\n' +
                        '  [i] Instagram\n' +
                        '  [s] Shutterstock\n' +
                        '  [?] Show shortcuts help',
                        'color: #00ff66; font-weight: bold; background: #111; padding: 2px 6px; border-radius: 3px;',
                        'color: inherit;'
                    );
                }

                logShortcuts();

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && modal.classList.contains('is-open')) {
                        closeModal();
                        return;
                    }

                    if (e.metaKey || e.ctrlKey || e.altKey) return;
                    const key = e.key.toLowerCase();

                    // Abrir o cerrar con ? (o ¿ en teclado español)
                    if (e.key === '?' || e.key === '¿') {
                        toggleModal();
                        return;
                    }

                    if (modal.classList.contains('is-open')) {
                        closeModal();
                    }

                    if (shortcuts[key]) {
                        const targetUrl = shortcuts[key];
                        const link = document.querySelector(`a[href="${targetUrl}"]`);
                        if (link) {
                            link.classList.add('active-shortcut');
                            setTimeout(function() {
                                link.classList.remove('active-shortcut');
                                if (key === 'm') {
                                    window.location.href = targetUrl;
                                } else {
                                    window.open(targetUrl, '_blank', 'noopener,noreferrer');
                                }
                            }, 120);
                        }
                    }
                });
            })();
        </script>
